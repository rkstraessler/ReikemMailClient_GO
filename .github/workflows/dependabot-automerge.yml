name: PR maintenance

on:
  workflow_run:
    workflows: [CI, PR branch activity]
    types: [completed]
  push:
    branches: [main]
  schedule:
    - cron: '13,43 * * * *'
  workflow_dispatch:

permissions: {}

concurrency:
  group: pr-maintenance-main
  cancel-in-progress: false

jobs:
  maintain:
    name: Maintain open pull requests
    if: >-
      github.repository == 'rkstraessler/ReikemMailClient_GO' &&
      github.ref == 'refs/heads/main' &&
      (github.event_name != 'workflow_run' ||
        (github.event.workflow_run.head_repository.full_name == github.repository &&
          (github.event.workflow_run.event == 'push' ||
           github.event.workflow_run.event == 'pull_request')))
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: dependabot-maintenance
    permissions:
      actions: read
      contents: read
      pull-requests: write
    steps:
      # A workflow run can originate from an untrusted PR. Use only main and API metadata.
      - name: Check out trusted maintenance code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/heads/main
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Create a repository-scoped maintenance token
        id: app
        if: vars.PR_AUTOMATION_CLIENT_ID != ''
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          client-id: ${{ vars.PR_AUTOMATION_CLIENT_ID }}
          private-key: ${{ secrets.PR_AUTOMATION_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ReikemMailClient_GO
          permission-contents: write
          permission-pull-requests: write
          permission-workflows: write
      - name: Update branches and reconcile Dependabot pull requests
        env:
          GH_TOKEN: ${{ github.token }}
          APP_TOKEN: ${{ steps.app.outputs.token }}
          APP_SLUG: ${{ steps.app.outputs.app-slug }}
        run: go run .github/scripts/pr-maintenance.go
