name: Verify release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing vMAJOR.MINOR.PATCH tag to verify
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-verification-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify tagged Go module
    if: github.repository == 'rkstraessler/ReikemMailClient_GO' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      TAG: ${{ inputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify release tag and commit
        shell: bash
        run: |
          [[ "$TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          commit=$(git rev-parse --verify "refs/tags/$TAG^{commit}")
          git merge-base --is-ancestor "$commit" refs/remotes/origin/main
          git switch --detach "$commit"
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Verify module path and run release checks
        shell: bash
        run: |
          major=${TAG#v}
          major=${major%%.*}
          expected="github.com/$GITHUB_REPOSITORY"
          if [[ "$major" != 0 && "$major" != 1 ]]; then expected="$expected/v$major"; fi
          test "$(go list -m -f '{{.Path}}')" = "$expected"
          go mod tidy -diff
          go mod verify
          go test -race ./...
          go build ./...
          go run golang.org/x/vuln/cmd/govulncheck@v1.10.0 ./...
      - name: Resolve the release through the public Go module proxy
        env:
          GOPROXY: https://proxy.golang.org
        shell: bash
        run: |
          module=$(go list -m -f '{{.Path}}')
          commit=$(git rev-parse HEAD)
          go mod download -json "$module@$TAG" | jq -e --arg tag "$TAG" --arg commit "$commit" \
              '.Version == $tag and .Origin.Hash == $commit and (.Sum | startswith("h1:"))'
      - name: Prepare release notes header
        shell: bash
        run: |
          banner=.github/assets/release-banners/reikem-mail-client-go-release-banner.png
          test -s "$banner"
          commit=$(git rev-parse HEAD)
          printf '![REIKEM Mail Client for Go release notes](https://raw.githubusercontent.com/%s/%s/%s)\n\n' "$GITHUB_REPOSITORY" "$commit" "$banner" >> "$GITHUB_STEP_SUMMARY"
          printf 'Verified module %s at commit %s.\n' "$TAG" "$commit" >> "$GITHUB_STEP_SUMMARY"
