name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: Go verification
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Check Go formatting
        shell: bash
        run: |
          unformatted=$(git ls-files -z '*.go' | xargs -0r gofmt -l --)
          if [[ -n "$unformatted" ]]; then
              printf 'Run gofmt on:\n%s\n' "$unformatted"
              exit 1
          fi
      - name: Verify module dependencies
        run: |
          go mod tidy -diff
          go mod verify
      - run: go vet ./...
      - run: go test ./...
      - run: go test -race ./...
      - run: go build ./...
      - name: Check Go vulnerabilities
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.10.0 ./...
      - name: Validate GitHub Actions
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12

  dependencies:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/dependency-review-action@bbc44d14a204704ccc493733616cd1e93a0321ec # v5.0.1
        with:
          fail-on-severity: low

  required:
    name: Required CI
    if: always()
    needs: [go, dependencies]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions: {}
    env:
      GO_RESULT: ${{ needs.go.result }}
      DEPENDENCY_RESULT: ${{ needs.dependencies.result }}
    steps:
      - shell: bash
        run: |
          test "$GO_RESULT" = success
          if [[ "$GITHUB_EVENT_NAME" == pull_request ]]; then
              test "$DEPENDENCY_RESULT" = success
          fi
